<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extremely Amateur Wildlife Photography</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-title">
        <span class="title-main">Extremely Amateur</span>
        <span class="title-sub">Wildlife Photography</span>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-inner">
      <p class="nav-label">Locations</p>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <main class="page-main">
    <div class="page-hero">
      <h1 class="page-title">Oregon (PNW)</h1>
      <p class="page-subtitle">All Over (including Washington)</p>
    </div>

    <div id="app">
      <div class="loading-state">Loading species...</div>
    </div>
  </main>

  <div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
      <h3>Upload photo</h3>
      <p class="modal-species-name" id="modalSpeciesName"></p>
      <label class="modal-label">Password</label>
      <input type="password" id="passwordInput" class="modal-input" placeholder="Enter password">
      <div class="modal-error" id="passwordError"></div>
      <div class="modal-actions">
        <button class="btn btn--ghost" id="modalCancel">Cancel</button>
        <button class="btn btn--primary" id="modalUnlock">Continue</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <h3>Upload photo</h3>
      <p class="modal-species-name" id="uploadSpeciesName"></p>
      <div class="upload-drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <div class="drop-inner">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>Click or drag a photo here</p>
          <span id="coordsNote" class="coords-note"></span>
        </div>
      </div>
      <div class="upload-progress" id="uploadProgress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="progressLabel">Uploading...</span>
      </div>
      <div class="modal-actions">
        <button class="btn btn--ghost" id="uploadCancel">Cancel</button>
        <button class="btn btn--primary" id="uploadSubmit" disabled>Upload</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="sightingModal">
    <div class="modal-box">
      <h3>Add unlisted sighting</h3>
      <p style="font-size:0.8rem;color:#888;margin-bottom:1rem;">For a species not already in the list</p>
      <input type="text" id="sightingCommon" class="modal-input" placeholder="Common name">
      <input type="text" id="sightingScientific" class="modal-input" placeholder="Scientific name (optional)" style="margin-top:0.5rem">
      <select id="sightingClass" class="modal-input" style="margin-top:0.5rem">
        <option value="bird">Bird</option>
        <option value="mammal">Mammal</option>
        <option value="reptile">Reptile</option>
        <option value="amphibian">Amphibian</option>
        <option value="insect">Insect</option>
        <option value="other">Other</option>
      </select>
      <input type="text" id="sightingNotes" class="modal-input" placeholder="Notes (optional)" style="margin-top:0.5rem">
      <div class="modal-actions">
        <button class="btn btn--ghost" id="sightingCancel">Cancel</button>
        <button class="btn btn--primary" id="sightingSubmit">Add sighting</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initPage } from '../js/app.js';
    initPage('Oregon');
  </script>
</body>
</html>
