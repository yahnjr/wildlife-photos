<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Species Finder — Wildlife Sightings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --header-h: 56px;
      --panel-w: 300px;
      --bg: #0f1117;
      --surface: #181c24;
      --surface2: #1e2330;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #e8e6e0;
      --text-muted: rgba(232,230,224,0.55);
      --text-dim: rgba(232,230,224,0.35);
      --accent: #c8853a;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans); }

    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900;
      height: var(--header-h);
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; height: 100%; padding: 0 1.25rem; }
    .header-title { display: flex; flex-direction: column; gap: 1px; }
    .title-main { font-family: var(--font-serif); font-size: 1rem; font-weight: 600; color: var(--text); }
    .title-sub { font-size: 0.65rem; font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
    .hamburger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
    .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--text-muted); transition: all 0.2s; border-radius: 2px; }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .nav-drawer {
      position: fixed; top: var(--header-h); right: 0; bottom: 0; z-index: 800;
      width: 260px; background: var(--surface); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); overflow-y: auto;
    }
    .nav-drawer.open { transform: translateX(0); }
    .nav-overlay { display: none; position: fixed; inset: 0; z-index: 799; background: rgba(0,0,0,0.4); }
    .nav-overlay.active { display: block; }
    .nav-inner { padding: 1.5rem 1.25rem; }
    .nav-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem; }
    .nav-link { display: block; padding: 0.45rem 0; font-size: 0.9rem; color: var(--text-muted); text-decoration: none; border-bottom: 1px solid var(--border); transition: color 0.15s; }
    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--accent); }

    .page-body { position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0; display: flex; }

    .species-panel {
      width: var(--panel-w); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 10;
    }
    .panel-header { padding: 1rem 1.1rem 0.85rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .panel-title { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 600; margin-bottom: 0.85rem; color: var(--text); }

    /* Taxon buttons */
    .taxon-filters { display: flex; flex-wrap: wrap; gap: 5px; }
    .taxon-btn {
      font-family: var(--font-sans); font-size: 0.7rem; font-weight: 400;
      letter-spacing: 0.04em; padding: 4px 9px; border-radius: 20px;
      border: 1px solid var(--border2); background: transparent;
      color: var(--text-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .taxon-btn:hover { border-color: rgba(255,255,255,0.28); color: var(--text); }
    .taxon-btn.active { color: #fff; border-color: transparent; }
    .taxon-btn[data-taxon="Aves"].active      { background: #2688F2; }
    .taxon-btn[data-taxon="Mammalia"].active  { background: #EB7F0E; }
    .taxon-btn[data-taxon="Reptilia"].active  { background: #35C440; }
    .taxon-btn[data-taxon="Amphibia"].active  { background: #932DEE; }
    .taxon-btn[data-taxon="Insecta"].active   { background: #c8a010; }
    .taxon-btn[data-taxon="Mollusca"].active  { background: #e05090; }

    .species-count-bar {
      padding: 0.5rem 1.1rem; font-size: 0.72rem; color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; flex-shrink: 0;
    }

    /* Active species filter bar */
    .species-filter-bar {
      display: none; align-items: center; gap: 8px;
      padding: 0.45rem 1.1rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border2);
      flex-shrink: 0;
    }
    .species-filter-bar.visible { display: flex; }
    .species-filter-name {
      flex: 1; min-width: 0; font-size: 0.72rem; color: var(--text);
      font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .species-filter-clear {
      flex-shrink: 0; background: none; border: 1px solid var(--border2);
      border-radius: 20px; padding: 2px 8px; font-size: 0.65rem; color: var(--text-muted);
      cursor: pointer; font-family: var(--font-sans); transition: all 0.15s; white-space: nowrap;
    }
    .species-filter-clear:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }

    .panel-body { flex: 1; overflow-y: auto; }
    .panel-status { padding: 1.25rem 1.1rem; font-size: 0.8rem; color: var(--text-dim); font-style: italic; text-align: center; line-height: 1.6; }
    .panel-loading { display: flex; align-items: center; justify-content: center; padding: 2rem; gap: 8px; font-size: 0.78rem; color: var(--text-dim); }
    .spinner { width: 14px; height: 14px; border: 1.5px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .species-list { list-style: none; }
    .species-item {
      display: flex; align-items: center;
      border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.1s; overflow: hidden;
    }
    .species-item:hover { background: var(--surface2); }

    .species-thumb {
      width: 56px; height: 56px; flex-shrink: 0;
      background: var(--surface2); position: relative; overflow: hidden;
    }
    .species-thumb img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transition: opacity 0.25s;
    }
    .species-thumb img.loaded { opacity: 1; }
    /* Coloured dot shown while image is absent or loading */
    .species-thumb__dot {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .species-thumb__dot::after {
      content: ''; width: 9px; height: 9px;
      border-radius: 50%; background: var(--dot-color, #888);
    }

    .species-item__info { flex: 1; min-width: 0; padding: 0 10px; }
    .species-item__common { font-size: 0.8rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .species-item__sci { font-size: 0.68rem; color: var(--text-dim); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .species-item__count { font-size: 0.68rem; color: var(--text-dim); flex-shrink: 0; padding-right: 10px; }

    /* Map */
    #viewDiv { flex: 1; position: relative; }
    .map-wordmark {
      position: absolute; bottom: 32px; right: 12px;
      display: flex; flex-direction: column; align-items: flex-end;
      pointer-events: none; z-index: 5;
    }
    .map-wordmark__title { font-family: var(--font-serif); font-size: 0.9rem; font-weight: 600; color: rgba(232,230,224,0.55); }
    .map-wordmark__sub { font-size: 0.6rem; font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(232,230,224,0.3); }

    .zoom-hint {
      position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(15,17,23,0.82); border: 1px solid var(--border2);
      border-radius: 20px; padding: 6px 14px; font-size: 0.73rem; color: var(--text-muted);
      pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; z-index: 20;
    }
    .zoom-hint.visible { opacity: 1; }

    @media (max-width: 640px) {
      :root { --panel-w: 100vw; }
      .page-body { flex-direction: column; }
      .species-panel { width: 100%; height: 240px; flex-shrink: 0; border-right: none; border-bottom: 1px solid var(--border); }
      #viewDiv { flex: 1; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-title">
      <span class="title-main">Extremely Amateur</span>
      <span class="title-sub">Wildlife Photography</span>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<nav class="nav-drawer" id="navDrawer">
  <div class="nav-inner"><p class="nav-label">Locations</p></div>
</nav>
<div class="nav-overlay" id="navOverlay"></div>

<div class="page-body">

  <aside class="species-panel">
    <div class="panel-header">
      <div class="panel-title">Species Finder</div>
      <div class="taxon-filters" id="taxonFilters">
        <button class="taxon-btn active" data-taxon="Aves">Birds</button>
        <button class="taxon-btn" data-taxon="Mammalia">Mammals</button>
        <button class="taxon-btn" data-taxon="Reptilia">Reptiles</button>
        <button class="taxon-btn" data-taxon="Amphibia">Amphibians</button>
        <button class="taxon-btn" data-taxon="Insecta">Insects</button>
        <button class="taxon-btn" data-taxon="Mollusca">Mollusca</button>
      </div>
    </div>

    <div class="species-count-bar" id="countBar" style="display:none">
      <span id="countLabel"></span>
    </div>

    <div class="species-filter-bar" id="speciesFilterBar">
      <span class="species-filter-name" id="speciesFilterName"></span>
      <button class="species-filter-clear" id="speciesFilterClear">&#x2715; Clear filter</button>
    </div>

    <div class="panel-body" id="panelBody">
      <div class="panel-status">Pan and zoom the map to explore.<br>Species appear when fewer than 100 are visible.</div>
    </div>
  </aside>

  <div id="viewDiv">
    <div class="map-wordmark">
      <span class="map-wordmark__title">Field Notes</span>
      <span class="map-wordmark__sub">iNaturalist 2026</span>
    </div>
    <div class="zoom-hint" id="zoomHint">Zoom in to load species list</div>
  </div>

</div>

<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/FeatureLayer",
  "esri/core/reactiveUtils"
], function(Map, MapView, FeatureLayer, reactiveUtils) {

  const SERVICE_URL = "https://services9.arcgis.com/RHVPKKiFTONKtxq3/arcgis/rest/services/iNat_PreUC_View/FeatureServer/0";

  const TAXON_COLORS = {
    Aves:     "#2688F2",
    Mammalia: "#EB7F0E",
    Reptilia: "#35C440",
    Amphibia: "#932DEE",
    Insecta:  "#c8a010",
    Mollusca: "#e05090"
  };

  const TAXON_LABELS = {
    Aves: "Birds", Mammalia: "Mammals", Reptilia: "Reptiles",
    Amphibia: "Amphibians", Insecta: "Insects", Mollusca: "Mollusca"
  };

  const OUT_FIELDS = [
    "common_name",
    "scientific_name",
    "taxon_category_name",
    "observed_on",
    "observed_on_year",
    "image_url"
  ];

  let activeTaxon = "Aves";
  let activeSpeciesFilter = null; 
  let debounceTimer = null;
  let lastExtentKey = "";

  function buildWhere(taxon, speciesFilter) {
    let expr = `observed_on_year = 2026 AND taxon_category_name = '${taxon}'`;
    if (speciesFilter) {
      expr += ` AND scientific_name = '${speciesFilter.replace(/'/g, "''")}'`;
    }
    return expr;
  }

  function applySpeciesFilter(scientific, common) {
    activeSpeciesFilter = scientific || null;
    const bar  = document.getElementById("speciesFilterBar");
    const name = document.getElementById("speciesFilterName");
    if (activeSpeciesFilter) {
      name.textContent = scientific || common;
      bar.classList.add("visible");
    } else {
      bar.classList.remove("visible");
    }
    layer.definitionExpression = buildWhere(activeTaxon, activeSpeciesFilter);
    layer.refresh();
    lastExtentKey = "";
    scheduleUpdate();
  }

  function makeRenderer(taxon) {
    return {
      type: "simple",
      symbol: {
        type: "simple-marker",
        style: "circle",
        size: 7,
        color: TAXON_COLORS[taxon],
        outline: { color: "rgba(0,0,0,0.45)", width: 0.8 }
      }
    };
  }

  const layer = new FeatureLayer({
    url: SERVICE_URL,
    definitionExpression: buildWhere(activeTaxon),
    outFields: OUT_FIELDS,
    renderer: makeRenderer(activeTaxon),
    popupTemplate: {
      title: "{common_name}",
      content: [{
        type: "fields",
        fieldInfos: [
          { fieldName: "common_name",         label: "Common name" },
          { fieldName: "scientific_name",     label: "Scientific name" },
          { fieldName: "taxon_category_name", label: "Category" },
          { fieldName: "observed_on",         label: "Observed" }
        ]
      }]
    }
  });

  const map = new Map({ basemap: "dark-gray-vector", layers: [layer] });

  const view = new MapView({
    container: "viewDiv",
    map,
    center: [-98, 38],
    zoom: 4,
    ui: { components: ["zoom", "attribution"] }
  });

  view.ui.move("zoom", "bottom-left");

  document.getElementById("taxonFilters").addEventListener("click", e => {
    const btn = e.target.closest(".taxon-btn");
    if (!btn || btn.classList.contains("active")) return;
    document.querySelectorAll(".taxon-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTaxon = btn.dataset.taxon;
    layer.definitionExpression = buildWhere(activeTaxon);
    layer.renderer = makeRenderer(activeTaxon);
    layer.refresh();
    lastExtentKey = "";
    scheduleUpdate();
  });

  function scheduleUpdate() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updateList, 650);
  }

  async function updateList() {
    if (!view.extent) return;

    const ext = view.extent;
    const key = `${activeTaxon}|${ext.xmin.toFixed(2)}|${ext.ymin.toFixed(2)}|${ext.xmax.toFixed(2)}|${ext.ymax.toFixed(2)}`;
    if (key === lastExtentKey) return;
    lastExtentKey = key;

    const panelBody  = document.getElementById("panelBody");
    const countBar   = document.getElementById("countBar");
    const countLabel = document.getElementById("countLabel");
    const zoomHint   = document.getElementById("zoomHint");

    panelBody.innerHTML = `<div class="panel-loading"><div class="spinner"></div> Querying…</div>`;
    countBar.style.display = "none";

    const countQ = layer.createQuery();
    countQ.geometry = ext;
    countQ.spatialRelationship = "intersects";
    countQ.where = buildWhere(activeTaxon);
    countQ.returnCountOnly = true;

    let total;
    try {
      total = await layer.queryFeatureCount(countQ);
    } catch(e) {
      panelBody.innerHTML = `<div class="panel-status">Could not reach the feature service.</div>`;
      return;
    }

    const label = TAXON_LABELS[activeTaxon].toLowerCase();
    countBar.style.display = "flex";
    countLabel.textContent = `${total.toLocaleString()} ${label} observation${total !== 1 ? "s" : ""} in view`;

    if (total === 0) {
      panelBody.innerHTML = `<div class="panel-status">No ${label} observations here for 2026.</div>`;
      return;
    }

    if (total > 100) {
      zoomHint.classList.add("visible");
      setTimeout(() => zoomHint.classList.remove("visible"), 2800);
      panelBody.innerHTML = `<div class="panel-status">${total.toLocaleString()} observations visible —<br>zoom in to see individual species.</div>`;
      return;
    }

    zoomHint.classList.remove("visible");

    const dataQ = layer.createQuery();
    dataQ.geometry = ext;
    dataQ.spatialRelationship = "intersects";
    dataQ.where = buildWhere(activeTaxon);
    dataQ.outFields = OUT_FIELDS;
    dataQ.returnGeometry = false;
    dataQ.num = 200;

    let result;
    try {
      result = await layer.queryFeatures(dataQ);
    } catch(e) {
      panelBody.innerHTML = `<div class="panel-status">Error loading species data.</div>`;
      return;
    }

    const grouped = {};
    result.features.forEach(f => {
      const a = f.attributes;
      const sciKey = a.scientific_name || a.common_name || "Unknown";
      if (!grouped[sciKey]) {
        grouped[sciKey] = {
          common:     a.common_name     || "Unknown",
          scientific: a.scientific_name || "",
          imageUrl:   null,
          count: 0
        };
      }
      grouped[sciKey].count++;
      if (!grouped[sciKey].imageUrl && a.image_url) {
        grouped[sciKey].imageUrl = a.image_url;
      }
    });

    const sorted = Object.values(grouped)
      .sort((a, b) => a.common.localeCompare(b.common));

    const color = TAXON_COLORS[activeTaxon];

    const ul = document.createElement("ul");
    ul.className = "species-list";

    sorted.forEach(sp => {
      const li = document.createElement("li");
      li.className = "species-item";

      const thumb = document.createElement("div");
      thumb.className = "species-thumb";
      thumb.style.setProperty("--dot-color", color);

      const dot = document.createElement("div");
      dot.className = "species-thumb__dot";
      thumb.appendChild(dot);

      if (sp.imageUrl) {
        const img = document.createElement("img");
        img.alt = sp.common;
        img.dataset.src = sp.imageUrl; // lazy-loaded below
        img.addEventListener("load",  () => img.classList.add("loaded"));
        img.addEventListener("error", () => img.remove());
        thumb.appendChild(img);
      }

      const info = document.createElement("div");
      info.className = "species-item__info";
      info.innerHTML = `
        <div class="species-item__common">${sp.common}</div>
        <div class="species-item__sci">${sp.scientific}</div>
      `;

      const cnt = document.createElement("div");
      cnt.className = "species-item__count";
      cnt.textContent = sp.count;

      li.appendChild(thumb);
      li.appendChild(info);
      li.appendChild(cnt);

      li.addEventListener("click", () => {
        const safe = (s) => s.replace(/'/g, "''");
        const q = layer.createQuery();
        q.where = sp.scientific
          ? `${buildWhere(activeTaxon)} AND scientific_name = '${safe(sp.scientific)}'`
          : `${buildWhere(activeTaxon)} AND common_name = '${safe(sp.common)}'`;
        q.returnGeometry = true;
        q.outSpatialReference = view.spatialReference;
        layer.queryExtent(q).then(r => {
          if (r.count > 0) view.goTo(r.extent.expand(1.5), { duration: 600 });
        });
      });

      ul.appendChild(li);
    });

    panelBody.innerHTML = "";
    panelBody.appendChild(ul);

    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          io.unobserve(img);
        }
      });
    }, { root: panelBody, rootMargin: "80px" });

    ul.querySelectorAll("img[data-src]").forEach(img => io.observe(img));
  }

  reactiveUtils.watch(
    () => view.stationary,
    stationary => { if (stationary) scheduleUpdate(); }
  );

  view.when(() => scheduleUpdate());

  // ── Nav drawer ───────────────────────────────────────────
  const hamburger = document.getElementById("hamburger");
  const drawer    = document.getElementById("navDrawer");
  const overlay   = document.getElementById("navOverlay");

  hamburger.addEventListener("click", () => {
    const open = drawer.classList.toggle("open");
    hamburger.classList.toggle("open", open);
    overlay.classList.toggle("active", open);
  });
  overlay.addEventListener("click", () => {
    drawer.classList.remove("open");
    hamburger.classList.remove("open");
    overlay.classList.remove("active");
  });
});
</script>

</body>
</html>
